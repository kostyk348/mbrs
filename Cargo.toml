[package]
name = "mbrs"
version = "0.1.0"
edition = "2021"
description = "mbrs — Modbus Studio. Rust Modbus master (SCADA-style) with N-rule 32-colour cell mapping."
license = "MIT OR Apache-2.0"
repository = "https://github.com/kostyk348/mbrs"
readme = "README.md"
keywords = ["modbus", "scada", "plc", "egui", "industrial"]
categories = ["gui", "hardware-support", "network-programming"]
rust-version = "1.80"

[lib]
name = "mbrs"
path = "src/lib.rs"

[[bin]]
name = "mbrs"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
serialport = "4.6"
# Linux-бэкенд выбора файлов — через XDG Desktop Portal, а не через GTK3: так сборка
# не требует libgtk-3-dev (из-за него CI был красным: glib-sys не собирался), и на Wayland
# диалоги ведут себя нативно. Windows/macOS используют свои нативные диалоги.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[profile.release]
opt-level = 2
lto = "thin"
