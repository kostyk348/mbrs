[package]
name = "mbrs"
version = "0.1.0"
edition = "2021"
description = "mbrs — Modbus Studio. Rust Modbus master (SCADA-style) with N-rule 32-colour cell mapping."
license = "MIT OR Apache-2.0"

[lib]
name = "mbrs"
path = "src/lib.rs"

[[bin]]
name = "mbrs"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
serialport = "4.6"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }

[profile.release]
opt-level = 2
lto = "thin"
