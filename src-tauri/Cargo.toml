[package]
name = "mbrs-tauri"
version = "0.1.0"
edition = "2021"
description = "mbrs product front-end (Tauri v2) over the mbrs core"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mbrs = { path = ".." }

[profile.release]
opt-level = 2
